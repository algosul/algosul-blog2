[package]
name = "algosul_blog"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = ["Window", "Performance", "PerformanceTiming"]

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
